<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gately RS · 管理后台</title>
<style>
:root{
  --accent:#0e7c66;--accent-dark:#0b6352;--accent-soft:#e7f2f0;--chart2:#6366f1;
  --border:#e6eaee;--border-soft:#edf0f3;--sidebar:#fff;--header:rgba(255,255,255,.86);
  --page:#f4f6f8;--surface:#fff;--text:#1f2328;--text2:#606970;--text3:#8b949e;
  --danger:#d92d20;--danger-soft:#fef3f2;--warn:#b54708;--warn-soft:#fffaeb;
  --ok:#067647;--ok-soft:#ecfdf3;--radius:10px;--header-h:56px;--aside-w:228px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html.dark{
  --accent:#1fa386;--accent-dark:#4cb59e;--accent-soft:#15221f;--chart2:#818cf8;
  --border:#2a2e33;--border-soft:#262a2f;--sidebar:#16181b;--header:rgba(22,24,27,.86);
  --page:#0f1113;--surface:#16181b;--text:#e6edf3;--text2:#9aa4ad;--text3:#6e7681;
  --danger:#f97066;--danger-soft:#2a1616;--warn:#fdb022;--warn-soft:#2b2113;
  --ok:#6cddac;--ok-soft:#12271e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.muted{color:var(--text2)}
.mini{font-size:12px}
.hide{display:none!important}



/* ---------- hub 汇总页标签栏 ---------- */
.hubtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px;padding-bottom:0}
.hubtab{border:0;background:transparent;color:var(--text2);font-size:13px;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}
.hubtab:hover{color:var(--accent);background:var(--accent-soft)}
.hubtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ---------- 全局搜索 ---------- */
.gsearch{position:fixed;inset:0;z-index:120;background:rgba(15,17,19,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.gsearch-box{width:min(680px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px -30px rgba(0,0,0,.6);overflow:hidden}
.gsearch-box>input{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;outline:none;padding:16px 18px;font-size:15px;color:var(--text)}
.gsearch-results{max-height:52vh;overflow:auto}
.gsearch-item{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--border-soft)}
.gsearch-item:hover{background:var(--accent-soft)}

/* ---------- 登录 ---------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(60% 70% at 50% 0%,var(--accent-soft),transparent 70%),var(--page)}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:30px 28px;box-shadow:0 20px 50px -24px rgba(15,23,42,.35)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-brand .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark))}
.login-brand h1{margin:0;font-size:20px;letter-spacing:.2px}
.login-brand p{margin:3px 0 0;color:var(--text2);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--text2);font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:96px;resize:vertical;font-family:var(--mono);font-size:12px}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.field.inline input{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text2);padding:5px 8px}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.block{width:100%;height:40px}
.login-oidc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)}

/* ---------- 布局 ---------- */
#app{display:none;min-height:100vh}
.aside{position:fixed;inset:0 auto 0 0;width:var(--aside-w);background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:30;transition:width .2s,transform .2s}
html.collapsed{--aside-w:68px}
.brand{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);overflow:hidden}
.brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-dark));flex:none}
.brand b{font-size:15px;white-space:nowrap}
.brand .ver{font-size:11px;color:var(--text3);font-family:var(--mono)}
html.collapsed .brand b,html.collapsed .brand .ver,html.collapsed .nav-text,html.collapsed .nav-group-title,html.collapsed .searchbox span{display:none}
.searchbox{margin:12px 12px 6px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:8px;color:var(--text3);cursor:default}
.searchbox input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-size:13px}
.nav{overflow-y:auto;flex:1;padding:4px 8px 16px;scrollbar-width:thin}
.nav-group-title{padding:14px 10px 5px;font-size:11px;letter-spacing:.6px;color:var(--text3);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:7px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--text2);cursor:pointer;text-align:left;font-size:13px}
.nav-item:hover{background:var(--accent-soft);color:var(--accent)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .nav-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item.todo{opacity:.55}
.nav-item.todo:hover{opacity:.85}
.nav-item .soon{font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--text3)}
html.collapsed .soon{display:none}
.aside-foot{border-top:1px solid var(--border);padding:8px}
.collapse{width:100%;height:34px;border:0;background:transparent;color:var(--text2);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.collapse:hover{background:var(--accent-soft);color:var(--accent)}

.main{margin-left:var(--aside-w);min-width:0;transition:margin-left .2s}
.header{position:sticky;top:0;z-index:20;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--header);backdrop-filter:saturate(180%) blur(10px)}
.crumb{display:flex;align-items:center;gap:7px;min-width:0}
.crumb .g{color:var(--text2);font-size:13px}
.crumb .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.menu-btn{display:none}
.user{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border:1px solid var(--border);border-radius:20px;background:var(--surface);cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:12px}
.user .name{font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{max-width:1440px;margin:0 auto;padding:20px 24px 32px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:21px;line-height:1.3}
.page-head p{margin:6px 0 0;color:var(--text2);font-size:13px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 卡片 / 表格 / 标签 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:0;overflow:hidden}
.card+.card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border);min-height:48px}
.card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.card-desc{font-size:12px;color:var(--text2)}
.card-body{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid>.card{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--chart2),transparent);opacity:.8}
.stat .k{font-size:12px;color:var(--text2)}
.stat .v{font-size:26px;font-weight:700;line-height:1.3;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--text3);margin-top:2px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 24px;border-radius:14px;
  border:1px solid var(--border);background:radial-gradient(120% 140% at 0% 0%,var(--accent-soft),transparent 55%),var(--surface);margin-bottom:16px}
.hero-main{display:flex;align-items:center;gap:16px;min-width:0}
.hero-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-dark));flex:none}
.hero-name{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-sub{font-size:13px;color:var(--text2);margin-top:4px}
.hero-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:9px;font-size:12px;color:var(--text2)}
.hero-side{display:flex;gap:26px;flex-wrap:wrap}
.kv-k{font-size:12px;color:var(--text2)}
.kv-v{font-size:15px;font-weight:600;margin-top:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.off{background:var(--text3);box-shadow:0 0 0 3px var(--page)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.gray{background:var(--page);color:var(--text2)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.amber{background:var(--warn-soft);color:var(--warn)}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border-soft);vertical-align:middle}
th{font-size:12px;color:var(--text2);font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--page) 60%,var(--surface))}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
tbody tr:last-child td{border-bottom:0}
td .ops{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:26px 16px;text-align:center;color:var(--text3);font-size:13px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--text2);font-size:12px}
pre{margin:8px 0 0;padding:12px;border-radius:8px;background:var(--page);border:1px solid var(--border-soft);font-size:12px;overflow:auto;max-height:320px;font-family:var(--mono)}
.help{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.6}
.svc{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px}
.svc:hover{background:var(--accent-soft)}
.svc .n{width:90px;font-weight:600;font-size:13px;flex:none}
.svc .d{flex:1;min-width:0;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}

/* ---------- 弹层 / 提示 ---------- */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.45);backdrop-filter:blur(2px)}
#modal.show{display:flex}
.dialog{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600}
.dialog-body{padding:18px 20px}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
#toasts{position:fixed;top:14px;right:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 28px))}
.toast{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 24px -12px rgba(0,0,0,.35);font-size:13px;line-height:1.5}
.toast.err{border-color:var(--danger);color:var(--danger)}
.toast.ok{border-color:var(--ok)}
.toast .msg{word-break:break-word}

@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.hero-side{width:100%;padding-top:14px;border-top:1px dashed var(--border)}}
@media(max-width:768px){
  :root{--header-h:52px;--aside-w:228px}
  .aside{transform:translateX(-100%)}
  html:not(.collapsed) .aside.open{transform:none;box-shadow:12px 0 30px -18px rgba(0,0,0,.5)}
  .main{margin-left:0}
  .menu-btn{display:grid}
  .content{padding:14px 12px 24px}
  .header{padding:0 8px 0 4px}
  .user .name{display:none}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:12px}
  .stat .v{font-size:21px}
}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.hero-icon{width:42px;height:42px}.hero-name{font-size:18px}}
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <div><h1>Gately RS</h1><p>Rust 边缘网关 · 独立重实现</p></div>
    </div>
    <div class="field"><label>管理员密码</label><input id="lgPass" type="password" autocomplete="current-password" placeholder="默认 gately.cn"></div>
    <div class="field"><label>TOTP 验证码（如已开启）</label><input id="lgTotp" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字，可留空"></div>
    <button class="btn primary block" id="lgBtn">登 录</button>
    <div id="lgOidc" class="login-oidc"></div>
    <p class="help">首次登录后请立即修改默认密码与 Token。本后台不应直接暴露到公网。</p>
  </div>
</div>

<div id="app">
  <aside class="aside" id="aside">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <b>Gately RS</b><span class="ver" id="sideVer"></span>
    </div>
    <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="navSearch" placeholder="筛选菜单"></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-foot"><button class="collapse" id="collapseBtn" title="收起侧边栏"><svg viewBox="0 0 24 24"><path d="M14 6 8 12l6 6"/><path d="M20 4v16"/></svg></button></div>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">
        <button class="icon-btn menu-btn" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="g" id="crumbG"></span><svg viewBox="0 0 24 24" id="crumbSep" style="width:14px;height:14px;color:var(--text3)"><path d="m9 6 6 6-6 6"/></svg>
        <span class="t" id="crumbT"></span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="themeBtn" title="切换主题"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
        <button class="icon-btn" id="refreshBtn" title="刷新数据"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/></svg></button>
        <button class="user" id="userBtn"><span class="avatar">A</span><span class="name">admin</span><svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </header>
    <main class="content">
      <div class="page-head"><div><h2 id="pageTitle"></h2><p id="pageDesc"></p></div><div class="page-actions" id="pageActions"></div></div>
      <div id="pageBody"></div>
    </main>
  </div>
</div>

<div id="modal"><div class="dialog"><div class="dialog-head"><span id="dlgTitle"></span><button class="icon-btn" id="dlgClose">×</button></div><div class="dialog-body" id="dlgBody"></div><div class="dialog-foot" id="dlgFoot"></div></div></div>
<div id="toasts"></div>
<div id="gsearch" class="gsearch hide">
  <div class="gsearch-box">
    <input id="gsearchInput" placeholder="全局搜索：站点域名、端口转发、DDNS、证书、任务（Ctrl/⌘+K）">
    <div id="gsearchResults" class="gsearch-results"></div>
  </div>
</div>

<script>
const ICON={
 dashboard:'M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z',
 globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
 shield:'M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm-3 10 2 2 4-4',
 server:'M4 4h16v6H4zM4 14h16v6H4zM7 7h.01M7 17h.01',
 route:'M6 3v6a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v6M6 3 3 6m3-3 3 3M18 21l-3-3m3 3 3-3',
 clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM12 7v5l3 2',
 key:'M14 7a4 4 0 1 0-3.5 4L9 13H5v4H2v4h4v-3h3v-3h2l2-2c.6.2 1.3.3 2 .3A4 4 0 0 0 14 7Z',
 tunnel:'M3 8h12a4 4 0 0 1 0 8H9M3 8l3-3M3 8l3 3M21 12h-5m5 0-3-3m3 3-3 3',

function toast(msg,type){
  const el=document.createElement('div');el.className='toast '+(type||'');
  el.innerHTML='<span>'+(type==='err'?'✖':type==='ok'?'✔':'ℹ')+'</span><span class="msg">'+esc(msg)+'</span>';
  $('toasts').appendChild(el);setTimeout(()=>el.remove(),4200);

async function api(path,opt){
  opt=Object.assign({},opt||{});opt.headers=Object.assign({},opt.headers||{});
  if(token)opt.headers.Authorization='Bearer '+token;
  if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  const r=await fetch(API_BASE+'/api'+path,opt);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}
  if(!r.ok)throw new Error(typeof d==='string'?d:JSON.stringify(d));return d;
}

function renderNav(filter){
  const f=(filter||'').toLowerCase();let html='';
  for(const grp of NAV){
    const items=grp.items.filter(i=>!i.hidden&&!i.tab&&(!f||i.name.toLowerCase().includes(f)));
    if(!items.length)continue;
    if(grp.g)html+='<div class="nav-group-title">'+esc(grp.g)+'</div>';
    for(const i of items){
      const active=current===i.id||hubOf(current)===i.id&&i.hub;
      html+='<button class="nav-item'+(active?' active':'')+(i.todo?' todo':'')+'" data-id="'+i.id+'">'+ico(i.icon)+'<span class="nav-text">'+esc(i.name)+'</span>'+(i.todo?'<span class="soon">未实现</span>':'')+'</button>';
    }
  }
  $('nav').innerHTML=html;
  $('nav').querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function go(id){
  id=LEGACY[id]||id;
  const item=ALLNAV.find(i=>i.id===id);
  if(item&&item.todo){toast(item.name+' 在 gately-rs 中尚未实现');return}
  current=id;location.hash=id.slice(1);
  const grp=NAV.find(g=>g.items.some(i=>i.id===id));
  $('crumbG').textContent=grp&&grp.g?grp.g:'首页';$('crumbSep').style.display=grp&&grp.g?'':'none';$('crumbT').textContent=PAGES[id]||id;
  renderNav($('navSearch').value);renderPage();
  if(innerWidth<=768)$('aside').classList.remove('open');
}

async function diag(kind){

  if(kind==='port'){body.target=$('dgTarget').value;body.port=parseInt($('dgPort').value)||443;}
  if(kind==='dns'){body.name=$('dgDns').value;body.record='A';}

}

let termWs=null;
window.openTerm=id=>{
  if(termWs){termWs.close();termWs=null}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const url=proto+'//'+location.host+API_BASE+'/api/terminal/ws/'+id+'?token='+encodeURIComponent(token);
  const out=$('termOut');if(!out){toast('终端面板未就绪','err');return}
  out.textContent='正在连接 '+decodeURIComponent(id)+' …\r\n';
  try{termWs=new WebSocket(url)}catch(e){out.textContent+='连接失败：'+e.message;return}
  termWs.onmessage=e=>{out.textContent+=e.data;out.scrollTop=out.scrollHeight};
  termWs.onclose=()=>{out.textContent+='\r\n[连接关闭]\r\n'};
  termWs.onerror=()=>toast('终端连接失败，请检查会话与 Token','err');
  $('termInput').focus();
};
window.termSend=()=>{
  const i=$('termInput');if(!i)return;
  if(termWs&&termWs.readyState===1)termWs.send(i.value+'\r');
  i.value='';
};

function fieldHTML(f,v){
  const val=v===undefined||v===null?'':String(v);
  if(f.t==='checkbox')return '<div class="field inline"><input type="checkbox" id="f_'+f.k+'" '+(v?'checked':'')+'><label for="f_'+f.k+'">'+esc(f.l)+'</label></div>';
  let control;
  if(f.t==='select')control='<select id="f_'+f.k+'">'+f.opts.map(o=>'<option '+(val===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  else if(f.t==='textarea')control='<textarea id="f_'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  else control='<input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'" '+(f.req?'required':'')+'>';
  return '<div class="field"><label for="f_'+f.k+'">'+esc(f.l)+'</label>'+control+'</div>';
}
function closeModal(){$('modal').classList.remove('show')}
function openForm(name){
  const f=FORMS[name];const vals=f.fill?f.fill(C.config):{};
  $('dlgTitle').textContent=f.title;
  $('dlgBody').innerHTML='<form id="dlgForm">'+f.fields.map(x=>fieldHTML(x,vals[x.k])).join('')+'</form>';
  $('dlgFoot').innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="dlgSave">保存</button>';
  $('modal').classList.add('show');
  $('dlgSave').onclick=async()=>{
    const form=$('dlgForm');if(!form.reportValidity())return;
    const v={};for(const x of f.fields)v[x.k]=x.t==='checkbox'?$('f_'+x.k).checked:$('f_'+x.k).value;
    const save=async()=>{try{await f.submit(v);closeModal();toast('保存成功','ok');await refreshData()}catch(e){toast('保存失败：'+e.message,'err')}};
    if(f.confirm)confirmDo(f.confirm,save);else await save();
  };
  const first=$('dlgForm').querySelector('input,select,textarea');if(first)first.focus();
}
function confirmDo(text,fn){
  $('dlgTitle').textContent='请确认';$('dlgBody').innerHTML='<p style="margin:0;line-height:1.7">'+esc(text)+'</p>';
  $('dlgFoot').innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="dlgYes">确定</button>';
  $('modal').classList.add('show');$('dlgYes').onclick=async()=>{closeModal();try{await fn();toast('操作成功','ok');await refreshData()}catch(e){toast('操作失败：'+e.message,'err')}};
}

const objById=(list,id)=>(Array.isArray(list)?list:[]).find(x=>String(x.id)===String(id));
function jsonEditor(title,obj,save,help){
  $('dlgTitle').textContent=title;
  $('dlgBody').innerHTML='<p class="help" style="margin-top:0">'+(help||'可直接编辑该项的全部配置字段；保存前会校验配置格式。')+'</p>'
    +'<div class="field"><textarea id="jsonBody" style="min-height:340px">'+esc(JSON.stringify(obj,null,2))+'</textarea></div>';
  $('dlgFoot').innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="dlgSave">保存</button>';
  $('modal').classList.add('show');
  $('dlgSave').onclick=async()=>{
    try{const v=JSON.parse($('jsonBody').value);await save(v);closeModal();toast('保存成功','ok');await refreshData()}
    catch(e){toast('保存失败：'+e.message,'err')}
  };
  $('jsonBody').focus();
}
window.editApiItem=(path,id,resource,title)=>{
  const obj=objById((ITEM_SOURCES[resource]||(()=>[]))(),decodeURIComponent(id));
  if(!obj){toast('未找到该配置项，请先刷新','err');return}
  jsonEditor(title||'编辑配置',obj,v=>api(path+'/'+id,{method:'PUT',body:v}));
};

function listenerOps(l){
  const n=encodeURIComponent(l.name||'');
  return '<div class="ops"><button class="btn sm" onclick="editListener(\''+n+'\')">'+ico('settings')+'编辑</button>'
    +'<button class="btn ghost sm" onclick="delListener(\''+n+'\')">删除</button></div>';
}
window.editListener=async name=>{
  try{
    const cfg=await api('/config'),obj=(cfg.listeners||[]).find(x=>x.name===decodeURIComponent(name));
    if(!obj){toast('未找到监听器','err');return}
    jsonEditor('编辑监听器',obj,v=>{cfg.listeners=cfg.listeners.map(x=>x.name===decodeURIComponent(name)?v:x);return api('/config',{method:'PUT',body:cfg})});
  }catch(e){toast(e.message,'err')}
};
window.delListener=name=>confirmDo('确认删除该监听器？',async()=>{
  const cfg=await api('/config');cfg.listeners=(cfg.listeners||[]).filter(x=>x.name!==decodeURIComponent(name));return api('/config',{method:'PUT',body:cfg});
});

window.copyApiItem=(resource,path,id)=>confirmDo('复制该配置项？',async()=>{

  if(!obj)throw new Error('未找到该配置项');

function opsCell(path,resource,item,copyResource,extra){
  const id=String(item.id||''),e=encodeURIComponent(id);let h='<div class="ops"><input type="checkbox" data-bulk="'+e+'" title="选中">';
  if(id)h+='<button class="btn sm" title="编辑全部配置" onclick="editApiItem(\''+path+'\',\''+e+'\',\''+resource+'\')">'+ico('settings')+'编辑</button>';
  if('enabled' in item)h+='<button class="btn sm" onclick="toggleApiItem(\''+path+'\',\''+e+'\','+!!item.enabled+')">'+(item.enabled?'停用':'启用')+'</button>';
  if(id&&(copyResource||resource))h+='<button class="btn ghost sm" onclick="copyApiItem(\''+(copyResource||resource)+'\',\''+path+'\',\''+e+'\')">复制</button>';

function moduleOps(name,key,item,extra){
  const id=encodeURIComponent(String(item.id||''));
  return '<div class="ops"><input type="checkbox" data-bulk="'+id+'" title="选中">'
    +'<button class="btn sm" onclick="editModuleItem(\''+name+'\',\''+(key||'')+'\',\''+id+'\')">'+ico('settings')+'编辑</button>'
    +(extra||'')

function modulePayload(cur,key,list){return Array.isArray(cur)?list:Object.assign({},cur,{[key]:list})}
window.editModuleItem=async(name,key,id)=>{
  try{
    const cur=await api('/modules/'+name),list=Array.isArray(cur)?cur:(cur[key]||[]),obj=objById(list,decodeURIComponent(id));
    if(!obj){toast('未找到该配置项','err');return}
    jsonEditor('编辑配置',obj,v=>api('/modules/'+name,{method:'PUT',body:modulePayload(cur,key,list.map(x=>x.id===obj.id?v:x))}));
  }catch(e){toast(e.message,'err')}
};
window.delModuleItem=(name,key,id)=>confirmDo('确认删除该项？',async()=>{
  const cur=await api('/modules/'+name),list=Array.isArray(cur)?cur:(cur[key]||[]);
  return api('/modules/'+name,{method:'PUT',body:modulePayload(cur,key,list.filter(x=>String(x.id)!==decodeURIComponent(id)))});
});
window.filterRows=input=>{
  const q=input.value.trim().toLowerCase(),root=input.closest('.card')||document;
  root.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('hide',!!q&&!tr.textContent.toLowerCase().includes(q)));
};
window.bulkAction=(path,action)=>{
  const ids=[].slice.call(document.querySelectorAll('input[data-bulk]:checked')).map(x=>x.dataset.bulk);
  if(!ids.length){toast('请先勾选条目');return}
  confirmDo('确认'+({enable:'启用',disable:'停用',delete:'删除'}[action]||action)+'选中的 '+ids.length+' 项？',async()=>{
    for(const id of ids){
      if(action==='delete')await api(path+'/'+id,{method:'DELETE'});
      else await api(path+'/'+id,{method:'PATCH',body:{enabled:action==='enable'}});
    }
  });
};

async function refreshData(){
  if(!token)return;
  try{
    const s=await api('/status');C.status=s;
    const [sites,certs,ddns,acme,waf,profiles,tunnels,stun,history,bans,forwards,routes,forwardStatus,routeStatus,channels,rules,tasks,taskStatus,iplists,siteusers,audit,system,stats,topology,knockRules,dockerContainers,terminalSessions,updateInfo,visitorAudit,wolHosts,storageMounts,fbStatus,smbStatus,perfSnapshot]=await Promise.all([
      api('/sites'),api('/certs'),api('/ddns'),api('/acme'),api('/waf/rules'),api('/waf/profiles'),
      api('/tunnels'),api('/stun'),api('/history'),api('/jail/bans'),api('/port-forwards'),api('/proto-routes'),
      api('/port-forwards/status'),api('/proto-routes/status'),api('/notifications/channels'),api('/notifications/rules'),
      api('/tasks'),api('/tasks/status'),api('/ip-lists'),api('/site-users'),api('/audit'),api('/system'),api('/metrics'),api('/topology'),
      api('/knock/rules').catch(()=>[]),api('/docker/containers').catch(()=>[]),api('/terminal/sessions').catch(()=>[]),
      api('/update/info').catch(()=>null),api('/visitor-audit').catch(()=>null),
      api('/wol/hosts').catch(()=>[]),api('/storage').catch(()=>[]),api('/filebrowser/status').catch(()=>null),
      api('/smb/status').catch(()=>null),api('/perf/snapshot').catch(()=>null)]);
    Object.assign(C,{sites,certs,ddns,acme,waf,profiles,tunnels,stun,history,bans,forwards,routes,forwardStatus,routeStatus,channels,rules,tasks,taskStatus,iplists,siteusers,audit,system,stats,topology,knockRules,dockerContainers,terminalSessions,updateInfo,visitorAudit,wolHosts,storageMounts,fbStatus,smbStatus,perfSnapshot});
    try{C.config=await api('/config')}catch{}
    $('app').style.display='block';$('login').classList.add('hide');
    $('sideVer').textContent='v'+(s.version||'0.2.0');
    renderPage();
  }catch(e){
    if(String(e.message).includes('401')){showLogin();return}
    $('app').style.display='block';$('login').classList.add('hide');
    toast('刷新失败：'+e.message,'err');
  }
}
function showLogin(){$('app').style.display='none';$('login').classList.remove('hide');$('lgPass').focus()}
async function doLogin(){
  try{
    const d=await api('/login',{method:'POST',body:{password:$('lgPass').value}});
    token=d.token;localStorage.setItem('gately_token',token);
    const code=$('lgTotp').value.trim();if(code)await api('/login/totp',{method:'POST',body:{code}});
    $('lgPass').value='';$('lgTotp').value='';toast('登录成功','ok');await refreshData();
  }catch(e){toast('登录失败：'+e.message,'err')}
}

$('lgBtn').onclick=doLogin;
$('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

}).catch(()=>{});
const p=new URLSearchParams(location.search);
if(p.get('oidc_code'))fetch('/api/login/oidc/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'code='+encodeURIComponent(p.get('oidc_code'))}).then(r=>r.json()).then(d=>{if(d.token){token=d.token;localStorage.setItem('gately_token',token)}}).catch(()=>{});
window.addEventListener('hashchange',()=>{const raw=location.hash.slice(1);const id=LEGACY[raw]||(raw?'/'+raw.replace(/^\//,''):'');if(id&&PAGES[id]&&id!==current)go(id)});
const bootRaw=location.hash.slice(1);const bootId=LEGACY[bootRaw]||(bootRaw?'/'+bootRaw.replace(/^\//,''):'');
if(PAGES[bootId])current=bootId;
go(current);if(token)refreshData();else showLogin();
</script>
<script>
(function(){
  const overlay=$('gsearch'),input=$('gsearchInput'),results=$('gsearchResults');
  function sources(){
    const out=[];
    (C.sites||[]).forEach(x=>(x.domains||[]).forEach(d=>out.push({page:'/web',label:'站点 '+d,detail:x.backend||''})));
    (C.forwards||[]).forEach(x=>out.push({page:'/portforward',label:'转发 '+x.name,detail:x.listen+' → '+(x.targets||[]).join(',')}));
    (C.routes||[]).forEach(x=>out.push({page:'/protoroute',label:'分流 '+x.name,detail:x.listen}));
    (C.ddns||[]).forEach(x=>out.push({page:'/ddns',label:'DDNS '+x.name,detail:x.provider}));
    (C.certs||[]).forEach(x=>out.push({page:'/ssl',label:'证书 '+x.id,detail:x.cert_path||''}));
    (C.tasks||[]).forEach(x=>out.push({page:'/cron',label:'任务 '+x.name,detail:x.cron}));
    (C.iplists||[]).forEach(x=>out.push({page:'/iplists',label:'IP 列表 '+x.name,detail:x.url||x.file||''}));
    (C.siteusers||[]).forEach(x=>out.push({page:'/webusers',label:'用户 '+x.username,detail:x.email||''}));
    return out;
  }
  function render(){
    const q=input.value.trim().toLowerCase();
    const list=sources().filter(x=>!q||(x.label+' '+x.detail).toLowerCase().includes(q)).slice(0,40);
    results.innerHTML=list.map(x=>'<div class="gsearch-item" onclick="go(\''+x.page+'\');closeGS()"><span>'+esc(x.label)+'</span><span class="mini muted">'+esc(x.detail||'')+'</span></div>').join('')||'<div class="gsearch-item mini muted">无匹配结果</div>';
  }
  function open(){overlay.classList.remove('hide');input.value='';render();input.focus();}
  function close(){overlay.classList.add('hide');}
  window.closeGS=close;
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();overlay.classList.contains('hide')?open():close();}
    if(e.key==='Escape')close();
  });
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  input.addEventListener('input',render);
  window.openGlobalSearch=open;
})();
</script>
